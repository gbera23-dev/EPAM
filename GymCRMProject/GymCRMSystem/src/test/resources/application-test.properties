spring.application.name=gym-crm-test
spring.main.banner-mode=off

# database credentials
spring.datasource.url=jdbc:h2:mem:Gym_CRM_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.auto-commit=true
spring.h2.console.enabled=false


# JPA properties
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false


security.jwt_secret_key=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1mb3ItY3VjdW1iZXItY29tcG9uZW50LXRlc3RzLTAxMjM0NTY3ODk=

security.jwt_expiration_time=3600000

data.TrainerDataPath=testdata/TrainerData.json
data.TraineeDataPath=testdata/TraineeData.json
data.TrainingDataPath=testdata/TrainingData.json


spring.activemq.broker-url=tcp://localhost:61616
spring.jms.template.receive-timeout=1000


eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false


logging.level.root=WARN
logging.level.app=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

