spring:
  datasource:
    # database credentials
    url: 'jdbc:mysql://mysqldb:3306/Gym_CRM_db'
    username: admin
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 20000
  h2:
    console:
      enabled: false
  jpa:
    # JPA properties
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  jms:
    cache:
      # JMS Config
      enabled: true
    listener:
      session:
        acknowledge-mode: client
      min-concurrency: 5
      max-concurrency: 20
    pub-sub-domain: false
logging:
  level:
    # logging
    root: WARN
    org:
      hibernate:
        SQL: WARN
      springframework:
        web: WARN
